syntax = "proto3";

package xray.transport.internet.splithttp;
option csharp_namespace = "Xray.Transport.Internet.SplitHttp";
option go_package = "github.com/roseforljh/RayBox-rx/internal/protocol/transport/internet/splithttp";
option java_package = "com.xray.transport.internet.splithttp";
option java_multiple_files = true;

import "transport/internet/config.proto";

message RangeConfig {
  int32 from = 1;
  int32 to = 2;
}

message XmuxConfig {
  RangeConfig maxConcurrency = 1;
  RangeConfig maxConnections = 2;
  RangeConfig cMaxReuseTimes = 3;
  RangeConfig hMaxRequestTimes = 4;
  RangeConfig hMaxReusableSecs = 5;
  int64 hKeepAlivePeriod = 6;
}

// Xray-RX experimental downlink recovery. Disabled unless explicitly enabled.
message RXConfig {
  bool enabled = 1;
  bool stallDetect = 2;
  int32 maxReplayBytes = 3;
  int32 maxSessions = 4;
  int32 probeIntervalMs = 5;
  int32 stallTimeoutMs = 6;
  int32 requestTimeoutMs = 7;
  int32 sessionTtlSecs = 8;
  int32 maxReconnects = 9;
  int32 retryDelayMs = 10;
  int32 maxResponseBytes = 11;
  int32 preconnects = 12;
  int32 maxSegments = 13;
  int32 maxConcurrentSegments = 14;
  repeated string spreadAddresses = 15;
  // Base64url 32-byte PSK for RX v2 control authentication/encryption.
  // Provision out of band. Never transmitted. Both peers must configure it.
  string authKey = 16;
}

// Client-only TCP urgent-data strategy. Ordinary XHTTP is the primary path.
message OOBConfig {
  bool enabled = 1;
  repeated int32 positions = 2;
  int32 delayMs = 3;
  int32 maxAttempts = 4;
  int32 attemptTimeoutMs = 5;
  repeated string addresses = 6;
  int32 tcpMaxSeg = 7;
  // Explicit alternate transport for the same proxy account, before user data.
  xray.transport.internet.StreamConfig fallbackSettings = 8;
  repeated string httpVersions = 9;
}

message PacketDownConfig {
  bool keepAlive = 1;
  RangeConfig keepAlivePeriod = 2;
  RangeConfig keepAliveLength = 3;
}

message Config {
  string host = 1;
  string path = 2;
  string mode = 3;
  map<string, string> headers = 4;
  RangeConfig xPaddingBytes = 5;
  bool noGRPCHeader = 6;
  bool noSSEHeader = 7;
  RangeConfig scMaxEachPostBytes = 8;
  RangeConfig scMinPostsIntervalMs = 9;
  int64 scMaxBufferedPosts = 10;
  RangeConfig scStreamUpServerSecs = 11;
  XmuxConfig xmux = 12;
  xray.transport.internet.StreamConfig downloadSettings = 13;
  bool xPaddingObfsMode = 14;
  string xPaddingKey = 15;
  string xPaddingHeader = 16;
  string xPaddingPlacement = 17;
  string xPaddingMethod = 18;
  string uplinkHTTPMethod = 19;
  string sessionIDPlacement = 20;
  string sessionIDKey = 21;
  string seqPlacement = 22;
  string seqKey = 23;
  string uplinkDataPlacement = 24;
  string uplinkDataKey = 25;
  RangeConfig uplinkChunkSize = 26;
  int32 serverMaxHeaderBytes = 27;
  string sessionIDTable = 28;
  RangeConfig sessionIDLength = 29;
  RXConfig rx = 30;
  OOBConfig oob = 31;
  bytes h2Params = 32;
  PacketDownConfig packetDown = 33;
}
