name: Build and release RayBox Android core

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the immutable GitHub release for this commit
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: raybox-android-${{ github.sha }}
  cancel-in-progress: false

jobs:
  android-core:
    name: Compile RayBox source for Android ARM32, ARM64, x86 and x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            sing-box/go.sum
            Xray-core/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0" "ndk;29.0.14206865"
      - name: Test protected dialer and Xray integration
        working-directory: sing-box
        run: go test ./common/dialer ./protocol/xray -count=1 -timeout 120s
      - name: Test RX, OOB transport and certificate reload
        working-directory: Xray-core
        run: go test ./transport/internet/splithttp ./transport/internet/tls ./infra/conf -run '^(TestRX|TestXrayRX|TestOOB|TestCertificateReload)' -count=1 -timeout 120s
      - name: Test Android artifact validation helpers
        run: python3 -I tools/test_check_android_artifacts.py
      - name: Build repository source into Android AARs
        shell: pwsh
        run: ./sing-box/build-libbox.ps1
      - name: Preserve built AARs and source manifest
        uses: actions/upload-artifact@v4
        with:
          name: raybox-android-${{ github.sha }}
          path: artifacts/libbox/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish immutable Android release
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    needs: android-core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: raybox-android-${{ github.sha }}
          path: artifacts/libbox
      - name: Verify source manifest and publish immutable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "android-$env:GITHUB_SHA"
          $files = @('libbox.aar', 'libbox-legacy.aar', 'build.json', 'LICENSE', 'Xray-LICENSE', 'SOURCE.txt')
          $manifest = Get-Content artifacts/libbox/build.json -Raw | ConvertFrom-Json
          if ($manifest.commit -ne $env:GITHUB_SHA -or $manifest.repository -ne $env:GITHUB_REPOSITORY) {
            throw 'Built Android artifact does not match this RayBox source'
          }
          if ($manifest.dirty -ne $false -or $manifest.tag -ne "android-$env:GITHUB_SHA") {
            throw 'Android release artifact must come from a clean tagged source'
          }
          function Resolve-TagCommit([string]$Name) {
            $refJson = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$Name" 2>$null | Out-String
            if ($LASTEXITCODE -ne 0 -or -not $refJson) { return $null }
            $ref = $refJson | ConvertFrom-Json
            if ($ref.object.type -eq 'commit') { return $ref.object.sha }
            if ($ref.object.type -ne 'tag') { throw "Tag $Name has unexpected object type $($ref.object.type)" }
            $tagObject = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($ref.object.sha)" --jq '.object.sha'
            if ($LASTEXITCODE -ne 0 -or -not $tagObject) { throw "Cannot dereference tag $Name" }
            return $tagObject.Trim()
          }
          function Assert-Manifest([object]$Candidate, [string]$Path, [string]$Root) {
            if ($Candidate.repository -ne $env:GITHUB_REPOSITORY -or $Candidate.commit -ne $env:GITHUB_SHA -or
                $Candidate.dirty -ne $false -or $Candidate.tag -ne $tag) { throw "Manifest identity mismatch: $Path" }
            foreach ($output in $Candidate.outputs) {
              $assetPath = Join-Path $Root $output.name
              if (-not (Test-Path -LiteralPath $assetPath)) { throw "Manifest asset missing: $assetPath" }
              $item = Get-Item -LiteralPath $assetPath
              $hash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLower()
              if ($item.Length -ne $output.size -or $hash -ne $output.sha256) { throw "Manifest asset mismatch: $assetPath" }
            }
          }
          $tagCommit = Resolve-TagCommit $tag
          if ($tagCommit -and $tagCommit -ne $env:GITHUB_SHA) { throw "Tag $tag points to $tagCommit" }
          $releaseJson = gh release view $tag --json isDraft 2>$null | Out-String
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            if (-not $tagCommit) { throw "Existing release $tag has no resolvable tag commit" }
            New-Item -ItemType Directory -Force -Path artifacts/published | Out-Null
            gh release download $tag --dir artifacts/published
            if ($LASTEXITCODE -ne 0) { throw "Cannot download existing release $tag" }
            $oldManifestPath = Join-Path (Resolve-Path artifacts/published) 'build.json'
            if (-not (Test-Path -LiteralPath $oldManifestPath)) { throw 'Existing release is missing build.json' }
            $oldManifest = Get-Content $oldManifestPath -Raw | ConvertFrom-Json
            Assert-Manifest $oldManifest $oldManifestPath (Resolve-Path artifacts/published)
            foreach ($file in @('libbox.aar', 'libbox-legacy.aar', 'LICENSE', 'Xray-LICENSE', 'SOURCE.txt')) {
              $builtHash = (Get-FileHash -LiteralPath (Join-Path artifacts/libbox $file) -Algorithm SHA256).Hash.ToLower()
              $oldPath = Join-Path artifacts/published $file
              if (Test-Path -LiteralPath $oldPath) {
                $oldHash = (Get-FileHash -LiteralPath $oldPath -Algorithm SHA256).Hash.ToLower()
                if ($builtHash -ne $oldHash) { throw "Existing asset differs: $file" }
              } elseif (-not (($releaseJson | ConvertFrom-Json).isDraft)) { throw "Published release is missing asset: $file" }
            }
            if (-not (($releaseJson | ConvertFrom-Json).isDraft)) {
              Write-Host "Reusing published Android release $tag"
              exit 0
            }
          } else {
            gh release create $tag --target $env:GITHUB_SHA --draft --latest=false --title "RayBox Android $($env:GITHUB_SHA.Substring(0, 12))" --notes "Built from $env:GITHUB_REPOSITORY@$env:GITHUB_SHA; Android ARM32, ARM64, x86 and x86_64."
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create Android release draft' }
          }
            foreach ($file in $files) {
              $existing = Join-Path artifacts/published $file
              if (-not (Test-Path -LiteralPath $existing)) {
                gh release upload $tag (Join-Path artifacts/libbox $file)
                if ($LASTEXITCODE -ne 0) { throw "Cannot upload $file" }
              }
            }
          gh release edit $tag --target $env:GITHUB_SHA --draft=false --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish Android core release' }
