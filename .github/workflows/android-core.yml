name: Build RayBox Android core

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raybox-android-${{ github.sha }}
  cancel-in-progress: false

jobs:
  android-core:
    name: Compile RayBox source for Android ARM32, ARM64, x86 and x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0" "ndk;29.0.14206865"
      - name: Test protected dialer and RayBox protocol integration
        run: go test ./common/dialer ./protocol/session ./protocol/streamconn -count=1 -timeout 120s
      - name: Test RX, OOB transport and certificate reload
        run: go test ./internal/protocol/transport/internet/splithttp ./internal/protocol/transport/internet/tls ./internal/protocol/infra/conf -run '^(TestRX|TestXrayRX|TestOOB|TestCertificateReload)' -count=1 -timeout 120s
      - name: Test Android artifact validation helpers
        run: python3 -I tools/test_check_android_artifacts.py
      - name: Build repository source into Android AARs
        shell: pwsh
        run: ./tools/build-libbox.ps1
      - name: Upload standard AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: raybox-android-${{ github.sha }}-standard-aar
          path: artifacts/libbox/raybox-android-*-standard.aar
          if-no-files-found: error
          retention-days: 7
      - name: Upload legacy AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: raybox-android-${{ github.sha }}-legacy-aar
          path: artifacts/libbox/raybox-android-*-legacy.aar
          if-no-files-found: error
          retention-days: 7
      - name: Upload integrated Android bundle
        uses: actions/upload-artifact@v4
        with:
          name: raybox-android-${{ github.sha }}-integrated
          path: artifacts/libbox/raybox-android-*-integrated.zip
          if-no-files-found: error
          retention-days: 7
      - name: Preserve built AARs and source manifest
        uses: actions/upload-artifact@v4
        with:
          name: raybox-android-${{ github.sha }}
          path: artifacts/libbox/
          if-no-files-found: error
          retention-days: 7
