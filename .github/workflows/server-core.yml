name: Build and release RayBox server core

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the immutable GitHub release for this commit
        required: true
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: raybox-server-${{ github.sha }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.27.3'
  GOTOOLCHAIN: local
  GOWORK: 'off'

jobs:
  validate:
    name: Validate Xray server source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: Xray-core/go.sum
      - name: Test server transport changes
        working-directory: Xray-core
        run: go test ./transport/internet/splithttp ./transport/internet/tls ./infra/conf -run '^(TestRX|TestXrayRX|TestOOB|TestCertificateReload)' -count=1 -timeout 120s

  build:
    name: Build ${{ matrix.arch }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            goarm: ''
          - arch: arm64
            goarch: arm64
            goarm: ''
          - arch: armv7
            goarch: arm
            goarm: '7'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: Xray-core/go.sum
      - name: Build Linux Xray core
        working-directory: Xray-core
        env:
          ARCH: ${{ matrix.arch }}
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          version_number="$(python3 - <<'PY'
          from pathlib import Path
          values = {}
          for line in Path('core/core.go').read_text().splitlines():
              fields = line.split()
              if len(fields) == 4 and fields[0] in ('Version_x', 'Version_y', 'Version_z') and fields[1:3] == ['byte', '=']:
                  values[fields[0]] = int(fields[3])
          print('.'.join(str(values[key]) for key in ('Version_x', 'Version_y', 'Version_z')))
          PY
          )"
          export VERSION="raybox-${version_number}-${GITHUB_SHA::12}"
          export BUILD_GO_VERSION="$(go version)"
          mkdir -p ../artifacts
          go build -trimpath -buildvcs=false \
            -ldflags="-s -w -buildid= -X github.com/xtls/xray-core/core.build=${VERSION}" \
            -o "../artifacts/xray-linux-${ARCH}" ./main
          test -x "../artifacts/xray-linux-${ARCH}"
          python3 - <<'PY'
          import hashlib, json, os, struct
          from pathlib import Path
          arch = os.environ['ARCH']
          path = Path('../artifacts') / ('xray-linux-' + arch)
          data = path.read_bytes()
          elf_class, machine = {'amd64': (2, 62), 'arm64': (2, 183), 'armv7': (1, 40)}[arch]
          if len(data) < 52 or data[:4] != b'\x7fELF' or data[4:6] != bytes((elf_class, 1)) or struct.unpack_from('<H', data, 18)[0] != machine:
              raise SystemExit('Unexpected ELF architecture: ' + arch)
          metadata = {'arch': arch, 'commit': os.environ['GITHUB_SHA'], 'version': os.environ['VERSION'], 'goVersion': os.environ['BUILD_GO_VERSION'],
                      'asset': {'file': path.name, 'size': len(data), 'sha256': hashlib.sha256(data).hexdigest()}}
          (path.parent / 'metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY
          if [ "$ARCH" = amd64 ]; then
            "../artifacts/xray-linux-${ARCH}" version | tee ../artifacts/version.txt
            grep -F "$VERSION" ../artifacts/version.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: raybox-server-${{ matrix.arch }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish immutable server release
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: raybox-server-*-${{ github.sha }}
          path: downloaded
          merge-multiple: false
      - name: Assemble and verify release assets
        run: |
          set -euo pipefail
          source_json="$(python3 -I tools/check_android_artifacts.py source .)"
          export SOURCE_JSON="$source_json"
          python3 - <<'PY'
          import hashlib, json, os, shutil, struct
          from pathlib import Path
          output = Path('artifacts')
          output.mkdir()
          commit = os.environ['GITHUB_SHA']
          source = json.loads(os.environ['SOURCE_JSON'])
          if source['commit'] != commit or source['dirty']:
              raise SystemExit('Source identity mismatch')
          manifest = {'schemaVersion': 1, 'repository': 'roseforljh/RayBox-rx', **source,
                      'tag': 'server-' + commit, 'version': None, 'xrayVersion': None,
                      'goVersion': None, 'architectures': ['amd64', 'arm64', 'armv7'],
                      'rxDefault': False, 'oobDefault': False, 'assets': {}}
          for arch, (elf_class, machine) in {'amd64': (2, 62), 'arm64': (2, 183), 'armv7': (1, 40)}.items():
              directory = Path('downloaded') / ('raybox-server-' + arch + '-' + commit)
              metadata = json.loads((directory / 'metadata.json').read_text())
              filename = 'xray-linux-' + arch
              data = (directory / filename).read_bytes()
              asset = {'file': filename, 'size': len(data), 'sha256': hashlib.sha256(data).hexdigest()}
              if metadata['arch'] != arch or metadata['commit'] != commit or metadata['asset'] != asset:
                  raise SystemExit('Artifact metadata mismatch: ' + arch)
              if len(data) < 52 or data[:4] != b'\x7fELF' or data[4:6] != bytes((elf_class, 1)) or struct.unpack_from('<H', data, 18)[0] != machine:
                  raise SystemExit('Unexpected ELF architecture: ' + arch)
              if not metadata['version'].startswith('raybox-') or not metadata['version'].endswith('-' + commit[:12]):
                  raise SystemExit('Invalid version: ' + arch)
              if metadata['goVersion'] != 'go version go' + os.environ['GO_VERSION'] + ' linux/amd64':
                  raise SystemExit('Unexpected build toolchain: ' + arch)
              for key in ('version', 'goVersion'):
                  if manifest[key] is not None and manifest[key] != metadata[key]:
                      raise SystemExit('Inconsistent ' + key)
                  manifest[key] = metadata[key]
              manifest['assets'][arch] = asset
              target = output / filename
              target.write_bytes(data)
              target.chmod(0o755)
          manifest['xrayVersion'] = manifest['version'].removeprefix('raybox-').removesuffix('-' + commit[:12])
          manifest['source'] = {
              'entry': 'Xray-core/main',
              'url': 'https://github.com/roseforljh/RayBox-rx/tree/' + commit,
              'license': 'Xray-core/LICENSE',
          }
          (output / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          source = 'RayBox server core\nRepository: ' + manifest['repository'] + '\nCommit: ' + commit
          source += '\nCorresponding source: ' + manifest['repository'] + '/tree/' + commit + '/Xray-core/main\n\n'
          (output / 'SOURCE.txt').write_text(source + Path('SOURCE.md').read_text())
          shutil.copyfile('Xray-core/LICENSE', output / 'LICENSE')
          PY
      - name: Create or resume immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="server-${GITHUB_SHA}"
          files=(xray-linux-amd64 xray-linux-arm64 xray-linux-armv7 manifest.json SOURCE.txt LICENSE)
          resolve_tag_commit() {
            local ref object_type object_sha
            ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}")" || return 1
            object_type="$(jq -r '.object.type' <<<"$ref")"
            object_sha="$(jq -r '.object.sha' <<<"$ref")"
            if [ "$object_type" = tag ]; then
              gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" --jq '.object.sha'
            elif [ "$object_type" = commit ]; then
              printf '%s\n' "$object_sha"
            else
              return 1
            fi
          }
          tag_commit=''
          if tag_commit="$(resolve_tag_commit 2>/dev/null)"; then
            test "$tag_commit" = "$GITHUB_SHA"
          fi
          release_json="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$tag\") | {isDraft: .draft}")"
          if [ -z "$release_json" ]; then
            gh release create "$tag" --target "$GITHUB_SHA" --draft --latest=false \
              --title "RayBox server ${GITHUB_SHA::12}" \
              --notes "Built from ${GITHUB_REPOSITORY}@${GITHUB_SHA}. Linux amd64, arm64 and armv7. Verify manifest.json before installation."
          else
            [ -n "$tag_commit" ] || { echo "Existing release $tag has no resolvable tag commit" >&2; exit 1; }
            mkdir published
            gh release download "$tag" --dir published
            if [ ! -f published/manifest.json ]; then
              echo "Existing release is missing manifest.json" >&2
              exit 1
            fi
            python3 - <<'PY'
            import hashlib, json
            from pathlib import Path
            manifest = json.loads(Path('published/manifest.json').read_text())
            commit = __import__('os').environ['GITHUB_SHA']
            if (manifest.get('repository') != 'roseforljh/RayBox-rx' or manifest.get('commit') != commit or
                    manifest.get('schemaVersion') != 1 or manifest.get('tag') != 'server-' + commit or
                    manifest.get('dirty') is not False or manifest.get('rxDefault') is not False or
                    manifest.get('oobDefault') is not False or not manifest.get('sourceDigest') or
                    manifest.get('sourceDigestAlgorithm') != 'sha256-git-path-kind-content-v1'):
                raise SystemExit('Existing manifest identity mismatch')
            source = manifest.get('source', {})
            if (source.get('entry') != 'Xray-core/main' or source.get('license') != 'Xray-core/LICENSE' or
                    source.get('url') != 'https://github.com/roseforljh/RayBox-rx/tree/' + commit):
                raise SystemExit('Existing manifest source mismatch')
            for asset in manifest.get('assets', {}).values():
                path = Path('published') / asset['file']
                if not path.is_file() or path.stat().st_size != asset['size'] or hashlib.sha256(path.read_bytes()).hexdigest() != asset['sha256']:
                    raise SystemExit('Existing manifest asset mismatch: ' + asset['file'])
            PY
            for file in "${files[@]}"; do
              if [ "$file" = manifest.json ]; then
                continue
              fi
              if [ ! -f "published/$file" ]; then
                echo "Existing release is missing asset: $file" >&2
                exit 1
              fi
              cmp --silent "artifacts/$file" "published/$file" || { echo "Existing asset differs: $file" >&2; exit 1; }
            done
            if [ "$(jq -r '.isDraft' <<<"$release_json")" = false ]; then
              printf 'Reusing published release %s\n' "$tag"
              exit 0
            fi
          fi
          for file in "${files[@]}"; do
            if [ ! -f "published/$file" ]; then
              gh release upload "$tag" "artifacts/$file"
            fi
          done
          gh release edit "$tag" --target "$GITHUB_SHA" --draft=false --latest=false
