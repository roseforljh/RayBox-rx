name: Build and release RayBox Windows core

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the immutable GitHub release for this commit
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: raybox-windows-${{ github.sha }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.27.3'
  GOTOOLCHAIN: local
  GOWORK: off

jobs:
  windows-core:
    name: Compile native Windows amd64 sing-box shell
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            sing-box/go.sum
            Xray-core/go.sum
      - name: Build and verify Windows artifact
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath tools/check_android_artifacts.py)) { throw 'Shared source checker is missing' }
          if (-not (Test-Path -LiteralPath tools/check_windows_runtime.py)) { throw 'Windows runtime checker is missing' }
          ./sing-box/build-windows.ps1
      - name: Verify source commit and artifact manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content artifacts/windows/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.repository -ne $env:GITHUB_REPOSITORY) { throw 'Unexpected source repository' }
          if ($manifest.commit -ne $env:GITHUB_SHA -or $manifest.fullHead -ne $env:GITHUB_SHA) { throw 'Artifact commit mismatch' }
          if ($manifest.tag -ne "windows-$env:GITHUB_SHA") { throw 'Unexpected release tag' }
          if ($manifest.dirty) { throw 'Release artifact must be built from clean source' }
          if ([string]::IsNullOrWhiteSpace($manifest.sourceDigest) -or $manifest.sourceDigestAlgorithm -ne 'sha256-git-path-kind-content-v1') { throw 'Missing source digest' }
          if ($manifest.source.url -ne "https://github.com/$env:GITHUB_REPOSITORY/tree/$env:GITHUB_SHA" -or
              $manifest.source.singBoxLicense -ne 'sing-box/LICENSE' -or $manifest.source.xrayLicense -ne 'Xray-core/LICENSE') { throw 'Unexpected source provenance' }
          if ($manifest.goVersion -notmatch "^go version go$env:GO_VERSION ") { throw 'Unexpected Go toolchain' }
          if ($manifest.goos -ne 'windows' -or $manifest.goarch -ne 'amd64' -or $manifest.pe.machine -ne 'amd64') { throw 'Unexpected Windows architecture' }
          foreach ($asset in $manifest.assets.psobject.Properties) {
            $path = Join-Path artifacts/windows $asset.Value.file
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing Windows asset: $($asset.Value.file)" }
            $item = Get-Item -LiteralPath $path
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLower()
            if ($item.Length -ne $asset.Value.size -or $hash -ne $asset.Value.sha256) { throw "Windows asset mismatch: $($asset.Value.file)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: raybox-windows-${{ github.sha }}
          path: artifacts/windows/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish immutable Windows release
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    needs: windows-core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: raybox-windows-${{ github.sha }}
          path: artifacts/windows
      - name: Verify source manifest and publish immutable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "windows-$env:GITHUB_SHA"
          $files = @('sing-box-windows-amd64.exe', 'manifest.json', 'LICENSE', 'Xray-LICENSE', 'SOURCE.txt')
          $manifest = Get-Content artifacts/windows/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.repository -ne $env:GITHUB_REPOSITORY -or
              $manifest.commit -ne $env:GITHUB_SHA -or $manifest.fullHead -ne $env:GITHUB_SHA -or
              $manifest.tag -ne "windows-$env:GITHUB_SHA" -or $manifest.dirty) {
            throw 'Built Windows artifact does not match this clean RayBox source'
          }
          if ([string]::IsNullOrWhiteSpace($manifest.sourceDigest) -or
              $manifest.sourceDigestAlgorithm -ne 'sha256-git-path-kind-content-v1' -or
              $manifest.source.url -ne "https://github.com/$env:GITHUB_REPOSITORY/tree/$env:GITHUB_SHA" -or
              $manifest.source.singBoxLicense -ne 'sing-box/LICENSE' -or
              $manifest.source.xrayLicense -ne 'Xray-core/LICENSE') {
            throw 'Built Windows artifact has invalid source provenance'
          }
          function Resolve-TagCommit([string]$Name) {
            $refJson = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$Name" 2>$null | Out-String
            if ($LASTEXITCODE -ne 0 -or -not $refJson) { return $null }
            $ref = $refJson | ConvertFrom-Json
            if ($ref.object.type -eq 'commit') { return $ref.object.sha }
            if ($ref.object.type -ne 'tag') { throw "Tag $Name has unexpected object type $($ref.object.type)" }
            $tagObject = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($ref.object.sha)" --jq '.object.sha'
            if ($LASTEXITCODE -ne 0 -or -not $tagObject) { throw "Cannot dereference tag $Name" }
            return $tagObject.Trim()
          }
          function Assert-Manifest([object]$Candidate, [string]$Root) {
            if ($Candidate.repository -ne $env:GITHUB_REPOSITORY -or $Candidate.commit -ne $env:GITHUB_SHA -or
                $Candidate.fullHead -ne $env:GITHUB_SHA -or $Candidate.tag -ne "windows-$env:GITHUB_SHA" -or $Candidate.dirty) { throw 'Existing manifest identity mismatch' }
            if ([string]::IsNullOrWhiteSpace($Candidate.sourceDigest) -or
                $Candidate.sourceDigestAlgorithm -ne 'sha256-git-path-kind-content-v1' -or
                $Candidate.source.url -ne "https://github.com/$env:GITHUB_REPOSITORY/tree/$env:GITHUB_SHA" -or
                $Candidate.source.singBoxLicense -ne 'sing-box/LICENSE' -or $Candidate.source.xrayLicense -ne 'Xray-core/LICENSE') { throw 'Existing manifest source provenance mismatch' }
            foreach ($asset in $Candidate.assets.psobject.Properties) {
              $entry = $asset.Value
              $assetPath = Join-Path $Root $entry.file
              if (-not (Test-Path -LiteralPath $assetPath)) { throw "Manifest asset missing: $($entry.file)" }
              $item = Get-Item -LiteralPath $assetPath
              $hash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLower()
              if ($item.Length -ne $entry.size -or $hash -ne $entry.sha256) { throw "Manifest asset mismatch: $($entry.file)" }
            }
          }
          $tagCommit = Resolve-TagCommit $tag
          if ($tagCommit -and $tagCommit -ne $env:GITHUB_SHA) { throw "Tag $tag points to $tagCommit" }
          $releaseJson = gh release view $tag --json isDraft 2>$null | Out-String
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            if (-not $tagCommit) { throw "Existing release $tag has no resolvable tag commit" }
            $release = $releaseJson | ConvertFrom-Json
            New-Item -ItemType Directory -Force -Path artifacts/published | Out-Null
            gh release download $tag --dir artifacts/published
            if ($LASTEXITCODE -ne 0) { throw "Cannot download existing release $tag" }
            $existingManifestPath = Join-Path (Resolve-Path artifacts/published) 'manifest.json'
            if (-not (Test-Path -LiteralPath $existingManifestPath)) { throw 'Existing release is missing manifest.json' }
            Assert-Manifest (Get-Content $existingManifestPath -Raw | ConvertFrom-Json) (Resolve-Path artifacts/published)
            foreach ($file in $files) {
              if ($file -eq 'manifest.json') { continue }
              $publishedPath = Join-Path artifacts/published $file
              if (-not (Test-Path -LiteralPath $publishedPath)) { throw "Existing release is missing asset: $file" }
              $builtHash = (Get-FileHash -LiteralPath (Join-Path artifacts/windows $file) -Algorithm SHA256).Hash.ToLower()
              $publishedHash = (Get-FileHash -LiteralPath $publishedPath -Algorithm SHA256).Hash.ToLower()
              if ($builtHash -ne $publishedHash) { throw "Existing asset differs: $file" }
            }
            if (-not $release.isDraft) {
              Write-Host "Reusing published release $tag"
              exit 0
            }
          } else {
            gh release create $tag --target $env:GITHUB_SHA --draft --latest=false --title "RayBox Windows $($env:GITHUB_SHA.Substring(0, 12))" --notes "Built from $env:GITHUB_REPOSITORY@$env:GITHUB_SHA; native Windows amd64 sing-box shell with embedded Xray outbound support."
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create Windows release draft' }
          }
          foreach ($file in $files) {
            $existing = Join-Path artifacts/published $file
            if (-not (Test-Path -LiteralPath $existing)) {
              gh release upload $tag (Join-Path artifacts/windows $file)
              if ($LASTEXITCODE -ne 0) { throw "Cannot upload $file" }
            }
          }
          gh release edit $tag --target $env:GITHUB_SHA --draft=false --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish Windows core release' }
